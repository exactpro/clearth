import org.xml.sax.SAXParseException

import java.util.concurrent.Callable

ext {
    cthImpl = 'implementation "com.exactprosystems.clearth:clearth-core'
    installationFiles = "${projectDir}/installation"

    toolsDir = "/src/main/webapp/ui/restricted/tools/"
}

def checkCthDir(clearthDir) {
    if (clearthDir == undef)
        throw new GradleException("You must set 'clearthDir' property via '-PclearthDir=<path_to_clearth_project>' key")
    if (!file(clearthDir).exists())
        throw new GradleException("ClearTH project directory '${clearthDir}' does not exist")
    if (!file("${clearthDir}/build.gradle").text.contains(cthImpl))
        throw new GradleException("Not a ClearTH project directory: no '${cthImpl}\"' in project's 'build.gradle'")
}

def checkCodecsFile(clearthDir) {
    if (file("${clearthDir}/cfg/codecs.xml").exists()) {
        println("- This project already contains a codec config file")
    } else {
        copy {
            from("${installationFiles}/codecs.xml")
            into "$clearthDir/cfg"
        }
        println("- Default codec config file added to project: ${clearthDir}/cfg/codecs.xml")
    }
}

def putCodec(codecValue, codecName, clearthDir) {
    checkCodecsFile(clearthDir)

    ant.replaceregexp(match: '</CodecConfigs>', replace: "${codecValue}\n</CodecConfigs>") {
        fileset(dir: "${clearthDir}/cfg/", includes: 'codecs.xml')
    }
    println("- ${codecName} codec config added to project's codec config file: ${clearthDir}/cfg/codecs.xml")
}

def putDictionary(dictName, dictPath, clearthDir) {
    if (file("${clearthDir}/cfg/dicts/${dictName}").exists()) {
        println("- Message dictionary already exists in project: ${clearthDir}/cfg/dicts/${dictName}")
    } else {
        copy {
            from(dictPath)
            into "${clearthDir}/cfg/dicts"
        }
        println("- Empty message dictionary added to project: ${clearthDir}/cfg/dicts/${dictName}")
    }
}

def putActions(clearthDir, actions) {
    def mappingPath = "${clearthDir}/cfg/actionsmapping.cfg"
    def mapping = file(mappingPath)
    mapping.append("\n${actions}")
    println("- Actions added to project's actions mapping: ${mappingPath}")
}

def putImplementation(moduleImpl, clearthDir) {
    ant.replaceregexp(match: "${cthImpl}", replace: "implementation \"${moduleImpl}:\${core_version}\"\n\t${cthImpl}") {
        fileset(dir: "${clearthDir}", includes: 'build.gradle')
    }
    println("- Module dependency added to project's 'build.gradle' file: ${moduleImpl}")
}

def putFile(fileName, source, destination) {
    def copiedFile = "${destination}/${fileName}"
    if (file(copiedFile).exists()) {
        println("- File already exists in project: ${copiedFile}")
    } else {
        def destDir = new File(copiedFile).getParentFile()
        destDir.mkdirs()
        copy {
            from ("${source}/${fileName}")
            into destDir
        }
        println("- File copied to project: ${copiedFile}")
    }
}

def putDir(dirName, source, destination) {
    def copiedDir = "${destination}/${dirName}"
    def destDir = new File(copiedDir).getParentFile()
    destDir.mkdirs()
    copy {
        from ("${source}/${dirName}")
        into copiedDir
    }
    println("- Directory copied to project: ${copiedDir}")
}

def putConfig(clearthDir, configName, configType, configPath, configValue, insertPattern) {
    ant.replaceregexp(file: "${clearthDir}/${configPath}", match: insertPattern, replace: "${configValue}\n${insertPattern}")
    println("- ${configName} ${configType} config added to project's ${configType} config file: ${clearthDir}/${configPath}")
}

def putFacesConfig(facesConfigValue, facesConfigName, clearthDir) {
    putConfig(clearthDir, facesConfigName, "faces", "src/main/webapp/WEB-INF/faces-config.xml", facesConfigValue, "</faces-config>")
}

def putMenuItem(clearthDir, itemName, itemValue) {
    def insertPattern = "\t\t\t\t</ul>"
    def templateFile = "${clearthDir}/src/main/webapp/templates/restricted.xhtml"
    ant.replaceregexp(file: templateFile, match: insertPattern, replace: "${itemValue}\n${insertPattern}")
    println("- ${itemName} menu item added to project's GUI template: ${templateFile}")
}

def putCode(targetFile, code, findRegex, desc) {
    ant.replaceregexp(file: targetFile, match: findRegex, replace: code)
    println("- ${desc} code added to ${targetFile}")
}

def getSourceDir(clearthDir) {
    def sourceDir = undef
    file(clearthDir).traverse(type: groovy.io.FileType.FILES, nameFilter: { it == 'Application.java' }) { appFile ->
        sourceDir = appFile.path.replace('Application.java', '')
    }
    if (sourceDir == undef)
        throw new GradleException("Unable to find Java source directory in project")
    return sourceDir
}

def getClearThCfg(clearthDir) {
    File cfg = new File("${clearthDir}/cfg/clearth.cfg")
    if (!cfg.exists())
        throw new GradleException("File clearth.cfg doesn't exist in ${clearthDir}/cfg")
    return cfg
}

def getClearThRootNode(File clearThCfg) {
    Node rootNode
    try {
        rootNode = new XmlParser().parse(clearThCfg)
    }
    catch (SAXParseException | IOException e) { // is thrown when clearth.cfg is not valid XML file or cannot be read
        throw new GradleException("Error occurred while reading clearth.cfg file as XML: " + e.getMessage(), e)
    }
    if (rootNode.name() != 'ClearThConfiguration')
        throw new GradleException("Root tag 'ClearThConfiguration' not found in clearth.cfg (found '${rootNode.name()}' instead)")
    return rootNode
}

def updateClearThCfg(File clearThCfg, Node updatedRootNode) {
    XmlNodePrinter printer = new XmlNodePrinter(new IndentPrinter(new FileWriter(clearThCfg), '\t'))
    printer.setPreserveWhitespace(true)
    printer.print(updatedRootNode)
}

/**
 * adds type to clearth.cfg under &lt;connectivity> - &lt;types> (and creates/expands them if necessary). For example, this:
 * <pre>
 * type = new Tuple4("FOO", "org.foobar.Foo", "connections/foo", ["org.foobar.Bar1", "org.foobar.Bar2"]
 * </pre>
 * Will result into adding this to clearth.cfg:
 * <pre>
 *     &lt;type>
 *         &lt;name>FOO&lt;/name>
 *         &lt;connectionClass>org.foobar.Foo&lt;/connectionClass>
 *         &lt;directory>connections/foo&lt;/directory>
 *         &lt;validationRules>
 *             &lt;ruleClass>org.foobar.Bar1&lt;/ruleClass>
 *             &lt;ruleClass>org.foobar.Bar2&lt;/ruleClass>
 *         &lt;/validationRules>
 *     &lt;/type>
 * </pre>
 * if array list is not specified then &lt;validationRules> tag won't be created.
 * @param typeToAdd type that should be added: first - name, second - connectionClass, third - directory
 * @param clearthDir directory with clearTh Project where type will be added (searched in cfg/clearth.cfg)
 * @throws GradleException if tag &lt;ClearThConfiguration> doesn't exist in clearth.cfg or file has incorrect xml structure
 */
def addConnectionTypeToCfg(Tuple4 typeToAdd, clearthDir) {
    File cfg = getClearThCfg(clearthDir)
    Node rootNode = getClearThRootNode(cfg)
    Node updatedRootNode = addConnectionTypeInfo(rootNode, typeToAdd)
    updateClearThCfg(cfg, updatedRootNode)
    
    println("- Type '${typeToAdd.getFirst()}' added to clearth.cfg")
}

static Node addConnectionTypeInfo(Node rootNode, Tuple4<String, String, String, List<String>> connectionTypeInfo) {
    Node connectivityNode = computeIfAbsent(rootNode, 'connectivity')
    Node typesNode = computeIfAbsent(connectivityNode, 'types')
    
    Node typeNode = typesNode.appendNode('type')
    typeNode.appendNode('name', connectionTypeInfo.first)
    typeNode.appendNode('connectionClass', connectionTypeInfo.second)
    typeNode.appendNode('directory', connectionTypeInfo.third)
    if (connectionTypeInfo.fourth && !connectionTypeInfo.fourth.isEmpty()) {
        Node rulesNode = typeNode.appendNode('validationRules')
        connectionTypeInfo.fourth.forEach {rulesNode.appendNode('ruleClass', it)}
    }
    return rootNode
}

static Node computeIfAbsent(Node parentNode, String childToAdd) {
    Node result = parentNode.get(childToAdd)?.getAt(0)
    if (!result) {
        result = parentNode.appendNode(childToAdd)
    }
    
    return result
}

def installModule(clearthDir, moduleName, moduleImpl, List<Callable> methodsToCall) {
    checkCthDir(clearthDir)

    if (file("${clearthDir}/build.gradle").text.contains(moduleImpl)) {
        println("${moduleName} module is already installed in project: ${clearthDir}")
        return
    }
    println("Installing ${moduleName} module in project: ${clearthDir}")
    
    methodsToCall?.forEach { it -> it.call() }
    
    putImplementation(moduleImpl, clearthDir)

    println("${moduleName} module has been installed")
}

def installMsgModule(clearthDir, moduleName, moduleImpl, moduleCodec, moduleDictName, moduleDictPath) {
    checkCthDir(clearthDir)

    if (file("${clearthDir}/build.gradle").text.contains(moduleImpl)) {
        println("${moduleName} module is already installed in project: ${clearthDir}")
        return
    }
    println("Installing ${moduleName} module in project: ${clearthDir}")

    putCodec(moduleCodec, moduleName, clearthDir)
    putDictionary(moduleDictName, moduleDictPath, clearthDir)
    putImplementation(moduleImpl, clearthDir)

    println("${moduleName} module has been installed")
}

def installConTypeModule(clearThDir, moduleName, moduleImpl, type) {
    installModule(clearThDir, moduleName, moduleImpl, [
            { addConnectionTypeToCfg(type, clearThDir) }
    ])
}
def putWebConfig(webConfigValue, webConfigName, clearthDir) {
    putConfig(clearthDir, webConfigName, "web", "src/main/webapp/WEB-INF/web.xml", webConfigValue, "</web-app>")
}

def putToolPanel(toolPanelValue, toolName, clearthDir) {
    putConfig(clearthDir, toolName, "tool panel", "src/main/webapp/ui/restricted/tools.xhtml", toolPanelValue, "\t\t</p:outputPanel>\r\n\t</ui:define>\r\n</ui:composition>")
}

def putCustomActions(clearthDir, actions) {
    def mappingPath = "${clearthDir}/cfg/actionsmapping.cfg"
    def mapping = file(mappingPath)
    if (mapping.readLines().findAll({x -> x =~ /^actions=/ }).isEmpty()) {
        def sourceDir = getSourceDir(clearthDir)
        def sourcePackage = getSourcePackage(new File("${sourceDir}/Application.java"), false, false, false)
        def actionPackage = sourcePackage.substring(8, sourcePackage.length() - 1) + ".automation.actions"
        println("- Project 'actionsmapping.cfg' file does not contain definition for '%actions%' package, those references would be replaced with exact value: ${actionPackage}")
        mapping.append("\n" + actions.replaceAll("%actions%", actionPackage))
    } else {
        mapping.append("\n${actions}")
    }
    println("- Actions added to project's actions mapping: ${mappingPath}")
}

def putToolInList(toolsManagerClass, toolName, toolListIndex) {
    ant.replaceregexp(file: "${toolsManagerClass}", match: "super.createToolsList\\(\\);",
            replace: "super.createToolsList();\n\t\tresult.add(new ToolInfo(${toolListIndex}, \"${toolName}\"));")
    println("- ${toolName} tool added to project's tool list with index=${toolListIndex} to tools manager class: ${toolsManagerClass}")
}

def putCodeInClass(classFilePath, codeValue) {
    ant.replaceregexp(file: "${classFilePath}", match: "}(?!.*})", replace: "\n${codeValue}\n}", flags: "s")
    println("- Code lines written into the project file: ${classFilePath}")
}

def putImportsIfMissing(classFilePath, String... imports) {
    def classFile = file(classFilePath)
    imports.each {
        def importValue = "import ${it};"
        if (!classFile.text.contains(importValue)) {
            ant.replaceregexp(file: "${classFilePath}", match: "import", replace: "${importValue}\nimport")
            println("- Import statements written into the project file '${classFilePath}': ${importValue}")
        }
    }
}

def getSourcePackage(appFile, withPackageKeyword, withSemicolon, withCopyright) {
    def result = ""
    def line
    appFile.withReader { reader ->
        while ((line = reader.readLine()) != null) {
            if (line.toString().startsWith("package ")) {
                result = result + line
                break
            } else if (withCopyright) {
                result = result + line + "\n"
            }
        }
    }
    if (result == "")
        throw new GradleException("Unable to find Java source package in project")
    return result.substring(withPackageKeyword ? 0 : 8, withSemicolon ? result.length() : result.length() - 1)
}

def addClassFiles(clearthDir, sourceRelativeDestDir, copyFromPath) {
    def sourceDir = getSourceDir(clearthDir)
    def destDir = "${sourceDir}/${sourceRelativeDestDir}"
    copy {
        from(copyFromPath)
        into(destDir)
    }

    def sourcePackage = getSourcePackage(new File("${sourceDir}/Application.java"), true, true, true)
    def destPackage = sourcePackage.substring(0, sourcePackage.length() - 1) + "." + sourceRelativeDestDir.replace("/", ".") + ";"
    ant.replaceregexp(match: "^package", replace: "${destPackage}") {
        fileset(dir: "${destDir}")
    }
    def classes = []
    new File(copyFromPath).eachFile {
        classes.add(it.name) 
    }
    println("- Classes added to project's package '${sourceRelativeDestDir}': ${classes}")
}

def addToToolsManager(clearthDir, toolName, toolListIndex) {
    def sourceDir = getSourceDir(clearthDir)
    def sourcePackage = getSourcePackage(new File("${sourceDir}/Application.java"), false, false, false)
    def applicationPath = sourceDir + "/Application.java"
    if (file(applicationPath).readLines().findAll({x -> x =~ /createToolsManager\(\)\s*($|\{)/ }).isEmpty()) {
        addClassFiles(clearthDir, "tools", "${installationFiles}/classes")

        def createToolsManagerMethod = file("${installationFiles}/code/Application_createToolsManager.java").text
        putCodeInClass(applicationPath, createToolsManagerMethod)
        putImportsIfMissing(applicationPath,
                "java.io.File",
                "com.exactprosystems.clearth.tools.ToolsManager",
                "${sourcePackage}.tools.EXAMPLE_ToolsManager")
        def toolsManager = "${sourceDir}tools/EXAMPLE_ToolsManager.java"
        println("- Example tools manager class added to project: ${toolsManager}")
        putToolInList(toolsManager, toolName, toolListIndex)
    } else {
        println("- This project already contains a custom tools manager class, please put 'new ToolInfo(${toolListIndex}, \"${toolName}\")' into tools list in project tools manager")
    }
}

def addToolFile(clearthDir, moduleProjectDir, toolFile) {
    copy {
        from("${moduleProjectDir}${toolsDir}${toolFile}")
        into("${clearthDir}${toolsDir}")
    }
    println("- New tool files added to project: ${clearthDir}${toolsDir}${toolFile}")
}

def addTool(clearthDir, moduleProjectDir, toolName, toolListIndex, toolFile, toolBeanName, facesConfig) {
    def toolPanel = file("${moduleProjectDir}/installation/tools.xhtml").text

    addToToolsManager(clearthDir, toolName, toolListIndex)
    addToolFile(clearthDir, moduleProjectDir, toolFile)
    putFacesConfig(facesConfig, toolBeanName, clearthDir)
    putToolPanel(toolPanel, toolName, clearthDir)

    println("- ${toolName} tool added to project")
}

def addTool(clearthDir, moduleProjectDir, toolName, toolListIndex, toolFile, toolBeanName) {
    def facesConfig = file("${moduleProjectDir}/installation/faces-config.xml").text
    addTool(clearthDir, moduleProjectDir, toolName, toolListIndex, toolFile, toolBeanName, facesConfig)
}
